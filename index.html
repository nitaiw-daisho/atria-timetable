/* ───────── Design tokens ───────── */
:root {
  --bg:        #0B0B0E;
  --text:      #FFFFFF;
  --text-2:    rgba(255,255,255,0.88);
  --muted:     rgba(255,255,255,0.78);
  --line:      rgba(255,255,255,0.12);
  --panel:     rgba(11,11,14,0.45);
  --time:      #F0A868;            /* orange = time cues and "almost full" only */
  --radius:    16px;
  --font:      'Montserrat', 'Gotham', 'Helvetica Neue', Arial, sans-serif;

  /* Type scale (stage px; 65" 1080p ≈ 0.75 mm per px) */
  --fs-hero:      88px;
  --fs-count:     72px;
  --fs-name:      38px;
  --fs-time:      36px;
  --fs-spots:     40px;
  --fs-name-sm:   32px;
  --fs-detail:    26px;
  --fs-small:     24px;            /* nothing smaller than this */
  --fs-meta:      26px;            /* secondary row text: end time, zone, instructor */
  --track-label:  0.12em;

  --row-h:   132px;
  --trow-h:  181px;               /* 3 rows + gaps end level with 4 Today rows */
  --gap:     16px;
  --c-time:  190px;
  --c-spots: 150px;
}

html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
body { font-family: var(--font); color: var(--text); -webkit-font-smoothing: antialiased; }

/* Fixed-size stage, scaled to fit the screen by JS */
#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: var(--bg); }
#stage.land { width: 1920px; height: 1080px; }
#stage.port { width: 1080px; height: 1920px;
  --row-h: 144px; --c-time: 180px; --c-spots: 140px; --fs-hero: 112px; --fs-count: 88px; }
/* Colour glows on their own layer, drifting very slowly (under 2 % over several minutes) so no glow edge sits on the
   same pixels. Moved in small steps on the 5 s tick (driftGlow), not by a running animation, so the TV redraws once
   every 5 s rather than 60 times a second. Scaled up a little so the shift never shows an edge. */
.glow { position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; transform: scale(1.04); }
.land .glow {
  background: radial-gradient(circle at 10% 108%, rgba(176,106,60,0.45), transparent 50%),
              radial-gradient(circle at 40% -18%, rgba(112,72,168,0.60), transparent 58%),
              radial-gradient(circle at 102% 85%, rgba(40,62,160,0.55), transparent 50%); }
.port .glow {
  background: radial-gradient(circle at 12% 100%, rgba(176,106,60,0.50), transparent 48%),
              radial-gradient(circle at 50% -6%, rgba(112,72,168,0.58), transparent 52%),
              radial-gradient(circle at 100% 72%, rgba(40,62,160,0.56), transparent 48%); }

/* Darkening layer so lists always sit on a calm ground */
.shade { position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; }
.land .shade { background: linear-gradient(180deg, rgba(11,11,14,0) 0, rgba(11,11,14,0) 320px, rgba(11,11,14,0.55) 440px, rgba(11,11,14,0.55) 100%); }
.port .shade { background: linear-gradient(180deg, rgba(11,11,14,0) 0, rgba(11,11,14,0) 560px, rgba(11,11,14,0.55) 680px, rgba(11,11,14,0.58) 100%); }

.screen { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; box-sizing: border-box; }
.land .screen { padding: 48px 72px 40px; }
.port .screen { padding: 56px 48px 48px; }

/* ───────── Header ───────── */
.hdr { flex-shrink: 0; display: flex; justify-content: space-between; align-items: flex-start; }
.land .hdr { height: 72px; margin-bottom: 32px; }
.port .hdr { height: 80px; margin-bottom: 40px; }
.logo { display: flex; flex-direction: column; justify-content: center; height: 72px; }
.logo img, .logo-svg { height: 72px; width: auto; display: block; }
.wordmark { font-size: 40px; line-height: 44px; font-weight: 300; letter-spacing: 0.5em; }
.wordmark-sub { margin-top: 6px; font-size: var(--fs-small); line-height: 24px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
.when { text-align: right; }
.date { font-size: var(--fs-small); line-height: 30px; font-weight: 500; letter-spacing: 0.08em; color: var(--text-2); }
.clockline { margin-top: 4px; display: flex; align-items: center; justify-content: flex-end; gap: 28px; }
.clock { font-size: 36px; line-height: 40px; font-weight: 300; letter-spacing: 0.04em; }
.live { display: flex; align-items: center; gap: 10px; font-size: var(--fs-small); line-height: 30px; font-weight: 600; letter-spacing: var(--track-label); text-transform: uppercase; }
.live-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--text); }
.live.on .live-dot { animation: pulse 2.5s ease-in-out infinite; }
.live.off .live-dot { background: rgba(255,255,255,0.45); }
.live.on { display: none; }        /* healthy: say nothing; only Offline / Updating / Demo show */
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.35 } }

/* ───────── Body layout ───────── */
.body { flex: 1; min-height: 0; }
.land .body { display: grid; grid-template-columns: 1120px 584px; column-gap: 72px; }
.port .body { display: flex; flex-direction: column; }
.land .side-spacer { height: 212px; }      /* hero 180 + 32 gap: aligns Tomorrow with Today */
.port .side-spacer { display: none; }
.port .col-side { margin-top: 40px; }

/* ───────── Hero: Next up ───────── */
.hero { flex-shrink: 0; }
.land .hero { height: 180px; margin-bottom: 32px; }
.port .hero { height: 356px; margin-bottom: 40px; }
.h-label { height: 28px; display: flex; align-items: center; gap: 16px; font-size: var(--fs-small); font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; }
.h-rule { width: 48px; height: 2px; background: var(--time); }
.h-main { display: flex; align-items: baseline; gap: 32px; min-width: 0; }
.land .h-main { margin-top: 12px; height: 96px; }   /* countdown sits right after the name, read as one line */
.port .h-main { margin-top: 16px; flex-direction: column; gap: 4px; height: auto; }
.h-name { font-size: var(--fs-hero); font-weight: 500; min-width: 0; flex: 1; }
.land .h-name { line-height: 96px; flex: 0 1 auto; }
.port .h-name { line-height: 120px; height: 120px; width: 100%; }
.h-count.long { font-size: calc(var(--fs-count) * 0.72); }
.h-count { font-size: var(--fs-count); font-weight: 300; color: var(--time); white-space: nowrap; flex-shrink: 0; }
.land .h-count { line-height: 96px; }
.port .h-count { line-height: 96px; height: 96px; }
/* Last 5 minutes before the next class: one soft pulse each time the countdown changes */
.h-count.pulse { animation: pulse-count 2.4s ease-in-out both; }
@keyframes pulse-count { 0%, 100% { opacity: 1; } 50% { opacity: 0.65; } }
.h-detail { font-size: var(--fs-detail); line-height: 32px; height: 32px; color: var(--text-2); display: flex; align-items: center; gap: 14px; }
.land .h-detail { margin-top: 12px; }
.port .h-detail.d1 { margin-top: 20px; }
.port .h-detail.d2 { margin-top: 8px; }
.h-empty { font-size: 64px; line-height: 76px; font-weight: 500; }
.h-empty-sub { margin-top: 16px; font-size: var(--fs-detail); line-height: 32px; font-weight: 500; color: var(--muted); }

.tdur { color: var(--muted); font-weight: 500; }
/* Smaller AM/PM so times read faster */
.ap { font-size: 0.62em; font-weight: 500; margin-left: 0.18em; letter-spacing: 0.04em; }

/* Motion: everything leaves upwards and arrives from below, in one order (out, then move, then in), with two curves */
:root { --ease-out: cubic-bezier(.4,0,1,1); --ease-in: cubic-bezier(.2,.7,.2,1); }
/* Rows that newly appear fade in after the others have moved */
.enter { animation: enter 0.6s 0.5s var(--ease-in) both; }
@keyframes enter { from { opacity: 0; transform: translateY(12px); } }
/* Hand-over when the next class changes: the old hero lifts away, then the new one rises in */
.hero { position: relative; }
.h-ghost { position: absolute; left: 0; top: 0; right: 0; pointer-events: none; animation: h-out 0.4s var(--ease-out) both; }
@keyframes h-out { to { opacity: 0; transform: translateY(-16px); } }
.hero.h-in > :not(.h-ghost) { animation: h-in 0.7s 0.4s var(--ease-in) both; }
@keyframes h-in { from { opacity: 0; transform: translateY(16px); } }
/* A class that has just started: its ring eases from orange (soon) to white (in progress) */
.row.now.went-live { animation: went-live 1.2s ease-in-out both; }
.row.now.went-live.enter { animation: enter 0.6s 0.5s var(--ease-in) both, went-live 1.6s 0.5s ease-in-out both; }
@keyframes went-live { from { box-shadow: inset 0 0 0 3px var(--time); } }

/* Overnight: only the next class and the clock, dimmed (less light at night, less burn-in) */
#stage.night .screen { opacity: 0.55; }
#stage.night .shade { background: rgba(11,11,14,0.6); }
#stage.night .today-sec, #stage.night #today, #stage.night .later-sec, #stage.night .col-side { display: none; }

/* ───────── Section labels ───────── */
.sec { height: 28px; margin-bottom: 16px; display: flex; align-items: center; gap: 20px; flex-shrink: 0; }
.sec-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: var(--fs-small); font-weight: 600; letter-spacing: var(--track-label); text-transform: uppercase; white-space: nowrap; }
.sec-rule { flex: 1; height: 1px; background: rgba(255,255,255,0.28); }
.sec-more { font-size: var(--fs-small); color: var(--muted); white-space: nowrap; font-weight: 500; }
.port .sec { height: 28px; }
/* Landscape only: Tomorrow's overflow in Today's unused rows */
.later-sec { margin-top: 32px; }
.later-sec.off { display: none; }
/* No classes left today: drop the Today section entirely and let Tomorrow move up */
.no-today .today-sec, .no-today #today { display: none; }
.no-today .later-sec, .port .no-today .col-side { margin-top: 0; }
/* Landscape, nothing left today: one day header runs across both columns and the list flows on to the right */
.land .one-day .later-sec .sec { width: calc(100% + 72px + 584px); }
.land .one-day .col-side .sec { visibility: hidden; }

.list { display: flex; flex-direction: column; gap: var(--gap); }

/* ───────── Class row ───────── */
.row { position: relative; overflow: hidden; height: var(--row-h); box-sizing: border-box; padding: 0 32px;
  display: grid; grid-template-columns: var(--c-time) minmax(0, 1fr) var(--c-spots); column-gap: 32px; align-items: center;
  background: var(--panel); border-radius: var(--radius); box-shadow: inset 0 0 0 1px var(--line); flex-shrink: 0; }
.row.now  { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
.row.soon { box-shadow: inset 0 0 0 3px var(--time); }
.t1 { font-size: var(--fs-time); line-height: 44px; font-weight: 500; white-space: nowrap; }
.t2 { font-size: var(--fs-meta); line-height: 30px; font-weight: 500; color: var(--muted); white-space: nowrap; margin-top: 6px; }
.n1 { display: flex; align-items: baseline; gap: 16px; min-width: 0; height: 44px; }
.name { font-size: var(--fs-name); line-height: 44px; font-weight: 500; min-width: 0; }
.tag { font-size: var(--fs-small); line-height: 30px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
.tag.now  { color: var(--text); display: flex; align-items: center; gap: 10px; }
.tag.now::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--text); }
.tag.soon { color: var(--time); }
.n2 { margin-top: 6px; display: flex; align-items: center; gap: 14px; font-size: var(--fs-meta); line-height: 30px; font-weight: 500; color: var(--muted); min-width: 0; }
.dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }
.sep { opacity: 0.9; }
.in { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp { text-align: right; white-space: nowrap; }
.sp .big { font-size: var(--fs-spots); line-height: 44px; font-weight: 500; color: var(--text-2); display: inline-block; }
.sp .lbl { font-size: var(--fs-small); line-height: 30px; font-weight: 500; color: var(--muted); margin-top: 6px; }
.sp.low .big { font-size: 50px; font-weight: 700; color: var(--time); }
.sp.low .lbl { color: var(--time); font-weight: 700; }
.sp.state .big { font-size: 32px; font-weight: 500; color: var(--muted); letter-spacing: 0.04em; }
.sp.state .lbl { opacity: 0.8; }
/* Rows that leave fade up and out where they were, while the others glide to their new places.
   #screen > raises it above .row, whose position: relative would otherwise put the ghost back in the page flow. */
#screen > .ghost { position: absolute; margin: 0; pointer-events: none; animation: leave 0.4s var(--ease-out) both; }
@keyframes leave { to { opacity: 0; transform: translateY(-12px); } }
.prog { position: absolute; left: 0; bottom: 0; width: 100%; height: 6px; background: var(--text); opacity: 0.7; transform-origin: 0 50%; }

/* Compact row for Tomorrow in landscape */
.trow { height: var(--trow-h); box-sizing: border-box; padding: 0 32px; display: flex; flex-direction: column; justify-content: center;
  background: var(--panel); border-radius: var(--radius); box-shadow: inset 0 0 0 1px var(--line); flex-shrink: 0; }
.tr1 { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; height: 40px; }

.tr1 .sp .big { font-size: var(--fs-name-sm); line-height: 40px; font-weight: 500; color: var(--text-2); }
.tr1 .sp.low .big { font-size: 38px; font-weight: 700; color: var(--time); }
.tr1 .sp.full .big { color: var(--muted); }
.tr1 .sp .unit { font-size: var(--fs-small); font-weight: 500; color: var(--muted); margin-left: 8px; }
.tr1 .sp.low .unit { color: var(--time); font-weight: 700; }
.tr2, .tr3 { font-size: var(--fs-meta); line-height: 30px; font-weight: 500; display: flex; align-items: center; gap: 14px; min-width: 0; }
.tr2 { margin-top: 8px; color: var(--text); font-weight: 600; }
.tr3 { margin-top: 4px; color: var(--muted); }

/* Shrink-to-fit text; ellipsis only as a last resort */
[data-fit] { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
[data-fit] > * { font-size: inherit; }

.msg { height: var(--row-h); box-sizing: border-box; padding: 0 32px; display: flex; flex-direction: column; justify-content: center;
  background: var(--panel); border-radius: var(--radius); box-shadow: inset 0 0 0 1px var(--line); }
.msg-1 { font-size: var(--fs-name-sm); line-height: 40px; font-weight: 500; }
.msg-2 { margin-top: 6px; font-size: var(--fs-small); line-height: 30px; font-weight: 500; color: var(--muted); }

/* Unavailable state */
.unavail { display: none; flex: 1; flex-direction: column; justify-content: center; }
.is-unavail .unavail { display: flex; }
.is-unavail .body { display: none; }
.u-1 { font-size: 72px; line-height: 84px; font-weight: 500; }
/* Closed page (club outside opening hours) */
.closed { display: none; flex: 1; min-height: 0; position: relative; }
.is-closed .closed { display: block; }
.is-closed .body { display: none; }
/* Opening and closing: the page that takes over fades in; the dimming of the screen eases too */
.swap-in { animation: swap-in 1.2s 0.5s ease-out both; }
@keyframes swap-in { from { opacity: 0; } }
.swap-out { position: absolute; margin: 0; pointer-events: none; animation: swap-out 0.6s ease-in both; }
@keyframes swap-out { to { opacity: 0; } }
/* ?motion=0: no animation at all (the screen steps once a minute as before); for a screen that struggles */
#stage.still *, #stage.still *::before { animation: none !important; transition: none !important; }
/* ?debug=1: what the screen really draws at, to check on the TV itself */
#debug { position: fixed; left: 8px; top: 8px; z-index: 9; padding: 6px 10px; background: rgba(0,0,0,0.75); color: #9f9;
  font: 14px/1.4 monospace; white-space: pre; pointer-events: none; }
.screen { transition: opacity 1.6s ease-out; }
/* The block drifts slowly inside the page (moved by JS) so nothing sits on the same pixels for hours */
.c-wrap { position: absolute; left: 0; top: 0; max-width: 100%; transition: transform 6s ease-in-out; }
.land .c-wrap { display: grid; grid-template-columns: auto auto; grid-template-areas: "main side" "book side"; column-gap: 120px; align-items: center; }
.c-main { grid-area: main; } .c-side { grid-area: side; } .c-book { grid-area: book; }
.c-main > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-1 { font-size: 160px; line-height: 176px; font-weight: 300; letter-spacing: 0.04em; }
.c-2 { margin-top: 32px; font-size: 64px; line-height: 76px; font-weight: 500; }
.c-soon { margin-top: 20px; font-size: 52px; line-height: 64px; font-weight: 300; color: var(--time); }
.c-first { margin-top: 28px; font-size: 34px; line-height: 42px; font-weight: 500; color: var(--text-2); }
.c-first .sp-txt { color: var(--muted); }
.c-label { font-size: var(--fs-small); line-height: 28px; font-weight: 600; letter-spacing: var(--track-label); text-transform: uppercase; color: var(--muted); margin-bottom: 20px; }
.c-hours { display: grid; grid-template-columns: auto auto; justify-content: start; column-gap: 48px; row-gap: 10px; font-size: 34px; line-height: 44px; font-weight: 500; white-space: nowrap; }
.c-hours .d { font-weight: 600; }
.c-hours .x { color: var(--time); }
.c-book { margin-top: 40px; font-size: var(--fs-meta); line-height: 32px; font-weight: 500; color: var(--muted); }
.port .c-1 { font-size: 200px; line-height: 216px; }
.port .c-side { margin-top: 72px; }
.port .c-book { margin-top: 56px; }
/* Dimmed for as long as it shows (less light, less burn-in), dimmer overnight */
#stage.shut .screen { opacity: 0.75; }
#stage.closed-night .screen { opacity: 0.55; }
#stage.shut .shade, #stage.closed-night .shade { background: rgba(11,11,14,0.5); }
.u-2 { margin-top: 20px; font-size: 32px; line-height: 40px; font-weight: 500; color: var(--muted); }

/* ───────── Footer ───────── */
.ftr { flex-shrink: 0; height: 32px; margin-top: auto; display: flex; justify-content: space-between; align-items: center;
  font-size: var(--fs-small); line-height: 32px; font-weight: 500; color: var(--muted); }
.land .ftr { margin-top: 24px; }
.ftr { gap: 32px; }
#status { white-space: nowrap; flex-shrink: 0; }
.ftr-left { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hrs { color: var(--text-2); font-weight: 600; }
.hrs.soon { color: var(--time); }
.ftr-left .sep { margin: 0 0.6em; }
</style>
</head>

<script>
/* ═════════ Config ═════════ */
const WORKER_URL   = 'https://atria-timetable-proxy.nitai-whitehurst.workers.dev';
const CACHE_KEY    = 'atria-classes-cache-v3';   /* v3: cleaned, slimmed records only */
const ADDRESS      = '180–192 Ann Street, Brisbane';
const LOGO_URL     = '';            /* set to the uploaded ATRIA logo (SVG/PNG) to replace the text wordmark */
const REFRESH_MINS = 5;              /* normal refresh */
const RETRY_SECS   = 60;             /* faster retry while the feed is failing */
const SOON_MINS    = 15;
const LOW_SPOTS    = 5;
const CACHE_MAX_H  = 24;             /* older saved schedules are not shown */
const STALE_MINS   = 15;             /* "Live" turns to "Offline" if the last good fetch is older than this */
const FETCH_SECS   = 10;             /* hard limit for a whole request, download included */
const RELOAD_AT_H  = 3;              /* nightly self-reload (Brisbane hour) to pick up code changes */
const ROWS = { land: { today: 4, tomorrow: 3 }, port: { today: 6, tomorrow: 1 } };   /* portrait: Today first; the next day keeps one row */
/* URL options: ?demo=1 sample data · ?portrait=1 / ?landscape=1 force orientation */
const Q = new URLSearchParams(location.search);
/* Demo only: ?demo=1&speed=20 runs the clock 20× faster, to watch classes start and finish;
   &at=21:50 starts the clock at that Brisbane time today (e.g. just before closing or opening) */
const AT = (([h, m]) => Q.get('demo') === '1' && h < 24 && m < 60 ? [h, m] : null)(/^\d{1,2}:\d\d$/.test(Q.get('at') || '') ? Q.get('at').split(':').map(Number) : [99, 99]);

/* Category dot colours: spread round the colour wheel so they tell apart at a distance; none is orange (orange = time) */

   First match wins, so "Stretch Reformer" is Reformer and "THRIVE Strike Club" is Boxing. */

  ['Yoga',       /yoga|sound healing/i],
  ['Stretch',    /melt|stretch/i],
  ['Pilates',    /pilates|ignite|\bhp\b|\bmat\b|thrive/i],
  ['Functional', /lift|hiit|kettlebell|bells|latin|zumba|run club|core/i],
  ['Event',      /tour|talk|activation|vibe/i],

const CAT_EXACT = { 'HB Lunch':'Pilates', 'HBB Lunch':'Barre' };   /* names with no keyword to go on */
const category = name => CAT_EXACT[name] || (CAT_RULES.find(([, re]) => re.test(name)) || [null])[0];
const HIDE = /^no classes|instructor training/i;   /* placeholder / staff-only sessions */

/* ═════════ Time helpers (Brisbane, UTC+10, no daylight saving) ═════════ */
const TZ = 'Australia/Brisbane';
const DAY = 86400000;
const ESC = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ESC[c]);
/* Date logic by arithmetic: Brisbane is a fixed UTC+10 with no daylight saving. Faster than Intl, and works on

const isoBne   = d => new Date(d.getTime() + OFF).toISOString().slice(0, 19) + '+10:00';
const hourBne  = d => new Date(d.getTime() + OFF).getUTCHours();
const fmt = d => new Date(d).toLocaleTimeString('en-AU', { timeZone: TZ, hour:'numeric', minute:'2-digit', hour12:true }).replace(/\s+/g, ' ').toUpperCase();
const fmtLong  = d => d.toLocaleDateString('en-AU', { timeZone: TZ, weekday:'long', day:'numeric', month:'long', year:'numeric' });
const fmtShort = d => d.toLocaleDateString('en-AU', { timeZone: TZ, weekday:'long', day:'numeric', month:'long' });
const fmtAbbr  = d => d.toLocaleDateString('en-AU', { timeZone: TZ, weekday:'short', day:'numeric', month:'short' });
const fmtDay   = d => d.toLocaleDateString('en-AU', { timeZone: TZ, weekday:'long' });
/* HTML time with a smaller AM/PM ("6:30<small AM>"); text from fmt() is digits, colon and AM/PM only */
const fmtHTML = d => { const t = fmt(d); return `${t.slice(0, -3)}<span class="ap">${t.slice(-2)}</span>`; };
/* Class length, e.g. "45 min" or "1 h 15 min" */
function dur(c) { const m = Math.round((Date.parse(c.endDate) - Date.parse(c.startDate)) / 60000), h = Math.floor(m / 60), r = m % 60;
  return h ? (r ? `${h} h ${r} min` : `${h} h`) : `${m} min`; }

/* ═════════ Class helpers ═════════ */

  /* instructors always show as first name + last initial: "Alexandria M." */
  const full = c.instructor ? `${c.instructor.firstName || ''} ${c.instructor.lastName || ''}`.trim() : '';
  let instr = full;
  const last = c.instructor ? String(c.instructor.lastName || '').trim() : '';
  if (last) instr = `${c.instructor.firstName || ''} ${last[0]}.`.trim();
  else { const w = full.split(/\s+/); if (w.length > 1) instr = `${w[0]} ${w[1][0]}.`; }

}
function state(c, now) {

}
const minsTo = (c, now) => Math.max(1, Math.ceil((new Date(c.startDate) - now) / 60000));
function spots(c) {

  if (limit === 0) return { kind: 'open' };

}
function spotsText(sp) {

}

  if (m <= 0) return 'Now';

  if (day === today.getTime()) { const h = Math.floor(m / 60), r = m % 60; return r ? `In ${h} h ${r} min` : `In ${h} h`; }
  return (day === today.getTime() + DAY ? 'Tomorrow ' : fmtDay(s) + ' ') + fmtHTML(s);   /* HTML: smaller AM/PM */
}
const sep = '<span class="sep">·</span>';
/* Room, with a shorter form for tight lines: "Functional Training Zone" → "Functional Training" */
const zoneHTML = m => `<span class="zn" data-short="${esc(m.zone.replace(/\s+(zone|studio|room|area)$/i, ''))}">${esc(m.zone)}</span>`;
const dot = col => `<span class="dot" style="background:${col}"></span>`;
function details(m, parts) { return parts.filter(Boolean).join(sep); }

/* ═════════ Opening hours ═════════ */
/* From the worker as { week: [{ day 0–6 (Sun = 0), open, close (minutes from midnight), closed, allDay }],
   except: [{ from, until ('YYYY-MM-DD', Brisbane, both included), open, close, closed }] }. Missing or bad: nothing is shown. */
const dateKey = ms => new Date(ms + OFF).toISOString().slice(0, 10);   /* ms = a Brisbane midnight */

    open: okMin(x.open) ? x.open : null, close: okMin(x.close) ? x.close : null });
  const usable = x => x.closed || x.allDay || (x.open !== null && x.close !== null);
  const week = h.week.filter(x => x && x.day >= 0 && x.day <= 6).map(x => ({ day: x.day, ...slot(x) })).filter(usable);
  const except = (Array.isArray(h.except) ? h.except : []).filter(x => x && /^\d{4}-\d\d-\d\d$/.test(x.from) && /^\d{4}-\d\d-\d\d$/.test(x.until))
    .map(x => ({ from: x.from, until: x.until, ...slot(x) })).filter(usable);
  return week.length ? { week, except } : null;
}
/* Hours for the Brisbane day starting at dayMs: a date exception wins over the weekly hours */
function hoursOn(h, dayMs) {

  if (ex) return { ...ex, special: true };

}
const at = (dayMs, min) => new Date(dayMs + min * 60000);

/* Is the club open right now, and if not, when does it next open (up to a week ahead)?
   Returns null when the hours don't cover today, so the screen carries on as if there were no hours. */

    if (now >= open && now < close) return { open: true, today, t, close };
    if (now < open) return { open: false, nextDay: today, next: t, nextAt: open };

/* Weekly hours grouped into runs of days with the same hours: "Mon – Fri 5:30 AM – 8:00 PM", "Sat – Sun …" */
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function weekRows(h, today) {

  if (os.nextDay === null) return `<div class="c-main"><div class="c-1">Closed</div><div class="c-2">Ask reception for opening times</div></div>${book}`;
  const i = Math.round((os.nextDay - today) / DAY);

    + (spots(first).kind === 'open' ? '' : ` <span class="sp-txt">· ${esc(spotsText(spots(first)))}</span>`) + `</div>` : '';

  const first = !wrap.style.transform || placeClosed.x > sx || placeClosed.y > sy;

/* ═════════ Data ═════════ */
let classes = [];
let hours = null;            /* opening hours, or null when the feed has none */
let mode = 'loading';        /* loading | starting (saved copy, first fetch pending) | live | cache | unavail | demo */
let savedAt = null;           /* when the shown data was fetched */
let failing = false;
let dirty = true;

/* Keep only usable classes, and only the fields the screen uses (the same rules for the feed and the saved copy) */
const okDate = v => typeof v === 'string' && !isNaN(Date.parse(v));
function clean(list, fromFeed) {
  return (Array.isArray(list) ? list : []).filter(c => c && typeof c === 'object' && c.classType && typeof c.classType.name === 'string'
      && okDate(c.startDate) && okDate(c.endDate) && !HIDE.test(c.classType.name)
      && (!fromFeed || (c.isDeleted === false && c.classType.isDeleted === false)))
    .map(c => ({ startDate: c.startDate, endDate: c.endDate, attendeesLimit: +c.attendeesLimit || 0, attendeesCount: +c.attendeesCount || 0,
      classType: { name: c.classType.name },
      instructor: c.instructor ? { firstName: c.instructor.firstName || '', lastName: c.instructor.lastName || '' } : null,
      clubZone: c.clubZone ? { name: c.clubZone.name || '', shortName: c.clubZone.shortName || '' } : null }))
    .sort((a, b) => Date.parse(a.startDate) - Date.parse(b.startDate));
}
const fresh = at => { const age = Date.now() - new Date(at).getTime(); return age >= 0 && age < CACHE_MAX_H * 3600000; };
function readCache() {   /* a fresh, cleaned saved copy, or null */
  try {
    const o = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    return o && fresh(o.savedAt) ? { savedAt: new Date(o.savedAt), classes: clean(o.classes, false), hours: cleanHours(o.hours) } : null;
  } catch (_) { return null; }
}

/* Run a request with a hard time limit that covers the whole download, not just the headers.

let inFlight = false, lastAttempt = 0;

  /* Watchdog first: whatever happens below (a hang, an exception), another attempt is already scheduled */
  clearTimeout(load.t);
  load.t = setTimeout(load, RETRY_SECS * 1000);
  const now = new Date();
  if (Q.get('demo') === '1') {
    /* sped up: keep one day's sample, and make a new one when the demo clock reaches the next day */
    if ((SPEED === 1 && !AT) || !classes.length || load.demoDay !== midnight(now).getTime()) {
      classes = demoClasses(now); hours = demoHours(now); load.demoDay = midnight(now).getTime(); }
    mode = 'demo'; savedAt = now; dirty = true; safeRender();
    clearTimeout(load.t); load.t = setTimeout(load, REFRESH_MINS * 60000);
    return;
  }
  if (inFlight) return;
  inFlight = true; lastAttempt = Date.now();
  const start = midnight(now), end = new Date(start.getTime() + 8 * DAY - 1000);   /* today + 7 days, Brisbane dates */
  const params = new URLSearchParams({ startDate: isoBne(start), endDate: isoBne(end) });
  try {
    const data = await getJSON(`${WORKER_URL}?${params}`);
    if (!data || !Array.isArray(data.value)) throw new Error('Unexpected reply from the feed');   /* never let a bad reply replace good data */
    classes = clean(data.value, true);
    hours = cleanHours(data.hours);
    savedAt = now; mode = 'live'; failing = false;
    writeCache(classes, hours, now);
  } catch (e) {
    console.error('Timetable load failed:', e);
    failing = true;
    if (!(savedAt && fresh(savedAt) && classes.length)) {
      const c = readCache();
      classes = c ? c.classes : []; savedAt = c ? c.savedAt : null; hours = c ? c.hours : null;
    }
    mode = savedAt && fresh(savedAt) ? 'cache' : 'unavail';
    if (mode === 'unavail') { classes = []; hours = null; }
  } finally { inFlight = false; }
  dirty = true; safeRender();
  clearTimeout(load.t);
  load.t = setTimeout(load, failing ? RETRY_SECS * 1000 : REFRESH_MINS * 60000);
}

/* Sample hours: 5:30 am – 10 pm every day, and a holiday closure in four days' time */
function demoHours(now) {
  const wk = [0, 1, 2, 3, 4, 5, 6].map(day => ({ day, open: 330, close: 1320 }));
  const hol = dateKey(midnight(now).getTime() + 4 * DAY);
  return cleanHours({ week: wk, except: [{ from: hol, until: hol, closed: true }] });
}

function demoClasses(now) {
  const tom = midnight(now).getTime() + DAY, t0 = Math.round(now.getTime() / 300000) * 300000, m = x => t0 + x * 60000;
  const mk = (name, s, dur, zone, lim, cnt) => ({ startDate: new Date(s).toISOString(), endDate: new Date(s + dur * 60000).toISOString(), isDeleted: false,
    classType: { name, isDeleted: false }, instructor: { firstName: '[Instructor]', lastName: '' }, clubZone: { name: zone },
    attendeesLimit: lim, attendeesCount: cnt });
  return [ mk('Hot Power Yoga', m(-17), 60, 'Main Studio', 20, 14), mk('Reformer', m(13), 50, 'Reformer Studio', 12, 12),
    mk('Lift HIIT', m(28), 45, 'Rooftop', 16, 14), mk('Yin Yoga', m(43), 60, 'Main Studio', 24, 10), mk('Strike Club', m(73), 45, 'Main Studio', 14, 6),
    mk('Latin Pulse', m(103), 45, 'Main Studio', 20, 8), mk('Mez Melt', m(118), 45, 'Mezzanine', 18, 4),
    mk('Hot Yoga Flow', tom + 7 * 3600000, 50, 'Main Studio', 20, 2), mk('IGNITE', tom + 8 * 3600000, 45, 'Main Studio', 18, 8),
    mk('Athletic Reformer', tom + 9 * 3600000, 50, 'Reformer Studio', 10, 8), mk('MELT (Free)', tom + 10 * 3600000, 45, 'Main Studio', 0, 0) ]
    .filter(c => { if (!AT) return true; const mins = d => Math.round((Date.parse(d) + OFF) / 60000) % 1440;
      return mins(c.startDate) >= 330 && mins(c.endDate) <= 1320 && mins(c.endDate) > mins(c.startDate); })
    .sort((a, b) => new Date(a.startDate) - new Date(b.startDate));
}

/* ═════════ Planning: which classes go where ═════════ */
/* Everything the screen decides about the classes, as plain data: no page access, so it can be checked with any
   list, clock and orientation. render() only draws the result. */
function plan(list, now, orient) {
  const port = orient === 'port', rows = ROWS[orient];
  const today = midnight(now).getTime(), tomorrow = today + DAY;
  const day = c => midnight(new Date(c.startDate)).getTime();
  const upcoming = list.filter(c => new Date(c.endDate) > now);
  const next = upcoming.find(c => new Date(c.startDate) > now) || null;
  const rest = upcoming.filter(c => c !== next);
  const todayAll = rest.filter(c => day(c) === today);
  /* Second section: tomorrow, or the next day that has classes (weekends, public holidays) */
  const ahead = rest.filter(c => day(c) > today);   /* not 'next': it is already in the hero */
  const nextDay = ahead.length ? day(ahead[0]) : tomorrow;
  const dayAll = rest.filter(c => day(c) === nextDay);
  const dayDate = new Date(nextDay + 12 * 3600000);
  const isTom = nextDay === tomorrow;
  const dayWord = isTom ? 'Tomorrow' : fmtDay(dayDate);
  const dayTitle = f => (isTom ? 'Tomorrow · ' : '') + f(dayDate);   /* "Tomorrow · Monday 19 October" or "Wednesday 21 October" */
  const todayShow = todayAll.slice(0, rows.today);
  /* Rows Today leaves unused go to the next day. With nothing left today the Today section is hidden.
     Portrait: the next day sits below Today, so its list just grows.
     Landscape: the next day has its own narrow column. Overflow goes into Today's column, which comes first
     when reading left to right, so it takes the earliest classes and the side column carries on with "Later …".
     That extra heading costs about one row, unless it takes the hidden Today heading's place. */
  const noToday = !todayShow.length;
  const spare = rows.today - todayShow.length;
  let mainShow = [], sideShow;
  if (port) sideShow = dayAll.slice(0, rows.tomorrow + spare);
  else {
    const k = Math.max(0, Math.min(noToday ? spare : spare - 1, dayAll.length - rows.tomorrow));
    mainShow = dayAll.slice(0, k);
    sideShow = dayAll.slice(k, k + rows.tomorrow);
  }
  const hidden = dayAll.length - mainShow.length - sideShow.length;
  const oneDay = !port && noToday && mainShow.length > 0;
  /* A full next class points to the next similar one that has spaces: the same class first, else the same category
     (another Reformer class for a full Reformer). Nothing similar left: the line just says Full. */
  let alt = null;
  if (next && spots(next).kind === 'full') {
    const nm = meta(next), later = upcoming.filter(c => new Date(c.startDate) > new Date(next.startDate) && spots(c).kind !== 'full');
    alt = later.find(c => meta(c).name === nm.name) || (nm.cat && later.find(c => meta(c).cat === nm.cat)) || null;
  }
  /* Overnight (9 pm–5 am, nothing on for the next 90 min): show only the next class, dimmed */
  const h = hourBne(now);
  const night = (h >= 21 || h < 5) && !upcoming.some(c => new Date(c.startDate) <= now) && (!next || new Date(next.startDate) - now > 90 * 60000);
  return {
    next, alt, night, noToday, oneDay, todayShow, mainShow, sideShow,
    todayMore: todayAll.length > todayShow.length ? `+${todayAll.length - todayShow.length} more later today` : '',
    laterTitle: dayTitle(fmtShort),
    laterMore: oneDay && hidden > 0 ? `+${hidden} more` : '',
    sideTitle: mainShow.length ? 'Later ' + (isTom ? 'tomorrow' : dayWord) : dayTitle(port ? fmtShort : fmtAbbr),
    sideMore: hidden > 0 ? `+${hidden} more` : '',
  };
}

/* ═════════ Rendering ═════════ */
const $ = id => document.getElementById(id);
let orient = null;

function rowHTML(c, now) {
  const m = meta(c), st = state(c, now), sp = spots(c);
  const tag = st === 'now' ? '<span class="tag now">In progress</span>' : st === 'soon' ? `<span class="tag soon">In ${minsTo(c, now)} min</span>` : '';
  const spHTML = sp.kind === 'open' ? `<div class="sp"></div>`
    : sp.kind === 'full' ? `<div class="sp state"><div class="big">FULL</div><div class="lbl">Waitlist</div></div>`
    : `<div class="sp ${sp.kind}"><div class="big">${sp.left}</div><div class="lbl">left</div></div>`;
  let prog = '';
  /* Drawn at the elapsed share, then eased to full over the time left (see fillBars), so it fills smoothly, not once a minute */
  if (st === 'now') { const s = new Date(c.startDate), e = new Date(c.endDate);
    prog = `<div class="prog" data-left="${Math.round((e - now) / SPEED)}" style="transform:scaleX(${Math.min(1, (now - s) / (e - s)).toFixed(4)})"></div>`; }
  return `<div class="row ${st}" data-k="${esc(c.startDate + m.name)}">
    <div><div class="t1">${fmtHTML(c.startDate)}</div><div class="t2">${dur(c)}</div></div>
    <div style="min-width:0"><div class="n1"><span class="name" data-fit="28">${esc(m.name)}</span>${tag}</div>
      <div class="n2" data-fit="24">${dot(m.col)}${details(m, [m.zone && zoneHTML(m), m.instr && `<span class="in">${esc(m.instr)}</span>`])}</div></div>
    ${spHTML}${prog}</div>`;
}

function trowHTML(c) {   /* landscape Tomorrow, narrow column */
  const m = meta(c), sp = spots(c);
  const right = sp.kind === 'open' ? '' : sp.kind === 'full' ? '<span class="big">Full</span>'
    : `<span class="big">${sp.left}</span><span class="unit">left</span>`;
  return `<div class="trow" data-k="${esc(c.startDate + m.name)}">
    <div class="tr1"><span class="name" data-fit="24">${esc(m.name)}</span><span class="sp${sp.kind === 'low' || sp.kind === 'full' ? ' ' + sp.kind : ''}">${right}</span></div>
    <div class="tr2" data-fit="24">${details(m, [`<span>${fmtHTML(c.startDate)}</span>`, `<span class="tdur">${dur(c)}</span>`])}</div>
    <div class="tr3" data-fit="24">${dot(m.col)}${details(m, [m.zone && zoneHTML(m), m.instr && `<span class="in">${esc(m.instr)}</span>`])}</div>
  </div>`;
}

const msgHTML = (a, b) => `<div class="msg"><div class="msg-1">${esc(a)}</div><div class="msg-2">${esc(b)}</div></div>`;

function emptyMessage(now) {
  const h = hourBne(now);
  if (h >= 21) return ['No more classes tonight', 'See you tomorrow'];
  if (h < 6)   return ['Classes start soon', 'Today’s timetable will appear here'];
  return ['No more classes today', 'See tomorrow’s timetable'];
}

function heroHTML(next, now, port, alt) {
  if (!next) { const [a, b] = emptyMessage(now); return `<div class="h-empty">${esc(a)}</div><div class="h-empty-sub">${esc(b)}</div>`; }
  const m = meta(next), sp = spots(next);
  /* Start time once: in the countdown when it names the day, otherwise here before the length */
  const cd = countdown(next, now), cdLen = cd.replace(/<[^>]*>/g, '').length;
  const start = /^(In |Now)/.test(cd) && `<span style="font-weight:500">${fmtHTML(next.startDate)}</span>`;
  const time = `<span style="font-weight:500">${dur(next)}</span>`;
  const zone = `<span style="display:flex;align-items:center;gap:12px">${dot(m.col)}${m.zone ? zoneHTML(m) : ''}</span>`;
  const instr = m.instr && `<span class="in">${esc(m.instr)}</span>`;
  /* A full class still leads, but the line points to the next class that has spaces */
  const altWhen = alt && (midnight(new Date(alt.startDate)).getTime() === midnight(new Date(next.startDate)).getTime() ? '' : fmtDay(new Date(alt.startDate)) + ' ');
  const status = sp.kind === 'full' && alt
    ? `<span style="font-weight:600">Full – next with spaces: ${esc(meta(alt).name)}, ${altWhen}${fmtHTML(alt.startDate)}</span>`
    : `<span style="font-weight:600${sp.kind === 'low' ? ';color:var(--time)' : ''}">${esc(spotsText(sp))}</span>`;
  const head = `<div class="h-label"><span class="h-rule"></span>Next up</div>
    <div class="h-main"><span class="h-name" data-fit="${port ? 64 : 52}">${esc(m.name)}</span><span class="h-count${cdLen > 10 ? ' long' : ''}${new Date(next.startDate) - now <= 5 * 60000 ? ' pulse' : ''}">${cd}</span></div>`;
  if (port) return head +
    `<div class="h-detail d1" data-fit="24">${details(m, [start, time, zone])}</div>
     <div class="h-detail d2" data-fit="24">${details(m, [instr, status])}</div>`;
  return head + `<div class="h-detail" data-fit="24">${details(m, [start, time, zone, !(sp.kind === 'full' && alt) && instr, status])}</div>`;
}

function fit(root) {
  root.querySelectorAll('[data-fit]').forEach(el => {
    el.style.fontSize = '';
    const min = parseFloat(el.dataset.fit);
    let fs = parseFloat(getComputedStyle(el).fontSize);
    /* too long = the line overflows, or the instructor's own box (which shrinks and clips) is cutting its text */
    const clipped = x => x.scrollWidth > x.clientWidth + 1;
    const over = () => clipped(el) || [].some.call(el.querySelectorAll('.in'), clipped);
    while (over() && fs > min) { fs -= 2; el.style.fontSize = fs + 'px'; }
    /* still too long at the minimum size: drop the room's last word ("… Zone"), then ellipsis as a last resort */
    if (over()) el.querySelectorAll('.zn[data-short]').forEach(x => { x.textContent = x.dataset.short; });
  });
}

/* Share the height left above the footer among the rows, as taller rows with bigger type (never more rows).
   Portrait: all rows. Landscape: Today's column only, when it has fewer rows than fit (e.g. three left today, where
   a fourth row would need its own Tomorrow heading). At most +44 px, which ends three rows level with the side column. */
function grow(port) {
  const st = $('stage').style;
  ['--row-h', '--fs-name', '--fs-time', '--fs-spots'].forEach(v => st.removeProperty(v));
  const rowEls = $('screen').querySelectorAll(port ? '.body .row, .body .msg' : '.col-main .row');
  if (!rowEls.length) return;
  const k = 1 / (parseFloat(getComputedStyle($('stage')).transform.split(',')[3]) || 1);   /* screen px → stage px */
  const free = ($('screen').querySelector('.ftr').getBoundingClientRect().top - rowEls[rowEls.length - 1].getBoundingClientRect().bottom) * k - (port ? 32 : 40);
  const add = Math.max(0, Math.min(port ? 24 : 44, Math.floor(free / rowEls.length)));
  if (!add) return;
  const base = port ? 144 : 132, r = (base + add) / base;
  st.setProperty('--row-h', `${base + add}px`);
  st.setProperty('--fs-name', `${Math.round(38 * r)}px`);
  st.setProperty('--fs-time', `${Math.round(36 * r)}px`);
  st.setProperty('--fs-spots', `${Math.round(40 * r)}px`);
}

function statusText(now) {
  const when = d => (midnight(d).getTime() === midnight(now).getTime() ? '' : fmtDay(d).slice(0, 3) + ' ') + fmt(d);
  if (mode === 'demo') return 'Demo data – not the live timetable';
  if (mode === 'starting') return 'Updating…';
  if (mode === 'unavail') return 'Offline – retrying every minute';
  if (mode === 'cache') return `Offline – last updated ${when(savedAt)}`;
  if (mode === 'live') return '';   /* healthy: nothing to report */
  return 'Loading…';
}

/* Where each class row sits, in stage px from the screen's corner, keyed by data-k */
function rowRects(screen) {
  const o = screen.getBoundingClientRect(), k = $('stage').getBoundingClientRect().width / $('stage').offsetWidth, m = new Map();
  screen.querySelectorAll('.body [data-k]').forEach(el => { const r = el.getBoundingClientRect();
    m.set(el.dataset.k, { el, x: (r.left - o.left) / k, y: (r.top - o.top) / k, w: r.width / k, h: r.height / k }); });
  return m;
}
/* Rows still on screen glide from their old place to the new one; rows that left fade out where they were */
function moveRows(screen, was) {
  const is = rowRects(screen), moved = [];
  is.forEach((r, key) => { const o = was.get(key);
    if (!o || !o.w || !r.w || Math.abs(o.x - r.x) + Math.abs(o.y - r.y) < 1) return;
    r.el.style.transition = 'none'; r.el.style.transform = `translate(${o.x - r.x}px, ${o.y - r.y}px)`; moved.push(r.el); });
  if (moved.length) { void screen.offsetWidth;
    moved.forEach(el => { el.style.transition = 'transform 0.9s 0.15s var(--ease-in)'; el.style.transform = '';
      setTimeout(() => { el.style.transition = ''; }, 1100); }); }
  was.forEach((o, key) => { if (is.has(key) || !o.w) return;
    const g = o.el; g.classList.remove('enter'); g.classList.add('ghost');
    Object.assign(g.style, { left: o.x + 'px', top: o.y + 'px', width: o.w + 'px', height: o.h + 'px' });
    screen.appendChild(g); setTimeout(() => g.remove(), 450); });
}
/* Running classes' bars: start from the share already done and fill to the end time */
function fillBars(root) {
  const bars = root.querySelectorAll('.prog[data-left]');
  if (!bars.length) return;
  void root.offsetWidth;
  bars.forEach(el => { el.style.transition = `transform ${el.dataset.left}ms linear`; el.style.transform = 'scaleX(1)'; });
}

const SHIFT = [[0, 0], [4, 2], [8, 4], [4, 6], [0, 8], [-4, 6], [-8, 4], [-4, 2]];   /* stage px */
function layout() {
  const stage = $('stage');
  const port = Q.get('portrait') === '1' ? true : Q.get('landscape') === '1' ? false : window.innerHeight > window.innerWidth;
  const o = port ? 'port' : 'land';
  if (o !== orient) { orient = o; stage.classList.remove('port', 'land'); stage.classList.add(o); dirty = true; }
  const W = port ? 1080 : 1920, H = port ? 1920 : 1080;
  const k = Math.min(window.innerWidth / W, window.innerHeight / H);
  stage.style.transform = `translate(${(window.innerWidth - W * k) / 2}px, ${(window.innerHeight - H * k) / 2}px) scale(${k})`;
  /* Screen care: nudge the content (not the background) a few pixels every hour, so nothing sits on the same pixels for days */
  const [dx, dy] = SHIFT[Math.floor(Date.now() / 3600000) % SHIFT.length];
  $('screen').style.transform = `translate(${dx}px, ${dy - 4}px)`;   /* -4: centre the 0–8 px vertical range */
  driftGlow();
}
/* Glow position from the clock: two slow waves (7 and 11 min), at most 1.8 % sideways and 1.5 % up or down, inside the
   4 % the layer is scaled up by. Still at night, while closed overnight, and with ?motion=0. */
function driftGlow() {
  const st = $('stage');
  if (STILL || st.classList.contains('night') || st.classList.contains('closed-night')) return;
  const t = Date.now() / 60000, x = 1.8 * Math.sin(t / 7 * 2 * Math.PI), y = 1.5 * Math.sin(t / 11 * 2 * Math.PI);
  st.querySelector('.glow').style.transform = `translate(${x.toFixed(2)}%, ${y.toFixed(2)}%) scale(1.04)`;
}

let lastMinute = -1;
function render() {
  layout();
  const now = new Date(), minute = Math.floor(now.getTime() / 60000);
  /* Watchdogs: never claim "Live" on old data, and restart fetching if it has gone quiet (e.g. after sleep) */
  if (mode === 'live' && now - savedAt > STALE_MINS * 60000) { mode = 'cache'; dirty = true; }
  if (!inFlight && Q.get('demo') !== '1' && Date.now() - lastAttempt > 2 * REFRESH_MINS * 60000) load();
  checkReload(now);
  /* header: cheap text updates only (keeps the Live pulse running smoothly) */
  $('clock').textContent = fmt(now);
  $('date').textContent = fmtLong(now);
  const live = $('live');
  live.className = 'live ' + (mode === 'live' ? 'on' : 'off');
  $('live-txt').textContent = mode === 'live' ? 'Live' : mode === 'demo' ? 'Demo' : mode === 'loading' || mode === 'starting' ? 'Updating' : 'Offline';
  /* Footer: hours on the left while open, address on the right; a status (Offline, Demo…) takes the address's place.
     Portrait is too narrow for both, so there the hours replace the address. */
  const os = mode === 'unavail' || mode === 'loading' ? null : openState(hours, now);
  const st = statusText(now), hrs = hoursHTML(hours, os, now);
  const left = hrs || ADDRESS, right = st || (hrs && orient === 'land' ? ADDRESS : '');
  if (orient + left + right !== render.left) {
    const el = $('ftr-left');
    el.innerHTML = left; $('status').textContent = right; render.left = orient + left + right;
    /* A status message (Offline, Demo) can leave too little room: drop the special-day note, keep today's hours */
    if (hrs && el.scrollWidth > el.clientWidth + 1) el.innerHTML = hoursHTML(hours, os, now, false);
  }
  if (!dirty && minute === lastMinute) return;
  dirty = false; lastMinute = minute;

  const screen = $('screen');
  const blank = mode === 'unavail' || mode === 'loading';
  screen.classList.toggle('is-unavail', blank);
  $('u-1').textContent = mode === 'loading' ? 'Loading timetable…' : 'Schedule unavailable';
  $('u-2').textContent = mode === 'loading' ? '' : 'Check the ATRIA app or ask reception for today’s classes.';
  /* Club closed (hours known): the Closed page replaces the schedule */
  /* A class running outside the listed hours (a late event) keeps the schedule up */
  const running = classes.some(c => new Date(c.startDate) <= now && now < new Date(c.endDate));
  const closed = !blank && !!(os && !os.open) && !running;
  /* Opening and closing: a copy of the page that is going fades out where it was, then the new page fades in */
  if (!STILL && render.shut !== undefined && render.shut !== closed && !blank) {
    const el = closed ? $('closed') : screen.querySelector('.body'), old = closed ? screen.querySelector('.body') : $('closed');
    const o = screen.getBoundingClientRect(), r = old.getBoundingClientRect(), k = $('stage').getBoundingClientRect().width / $('stage').offsetWidth;
    if (r.width) {
      /* the copy keeps the page's layout but is no longer .body / #closed, so nothing mistakes it for the real page */
      const cs = getComputedStyle(old), g = old.cloneNode(true);
      g.querySelectorAll('[id],[data-k]').forEach(x => { x.removeAttribute('id'); x.removeAttribute('data-k'); }); g.removeAttribute('id');
      g.className = 'swap-out';
      Object.assign(g.style, { display: cs.display, gridTemplateColumns: cs.gridTemplateColumns, columnGap: cs.columnGap, flexDirection: cs.flexDirection });
      Object.assign(g.style, { left: (r.left - o.left) / k + 'px', top: (r.top - o.top) / k + 'px', width: r.width / k + 'px', height: r.height / k + 'px' });
      screen.appendChild(g); setTimeout(() => g.remove(), 700);
    }
    [$('closed'), screen.querySelector('.body')].forEach(x => x.classList.remove('swap-in'));
    void el.offsetWidth; el.classList.add('swap-in');
    clearTimeout(render.swapT); render.swapT = setTimeout(() => el.classList.remove('swap-in'), 2000);
  }
  if (!blank) render.shut = closed;
  screen.classList.toggle('is-closed', closed);
  $('stage').classList.toggle('shut', closed);
  $('stage').classList.toggle('closed-night', closed && (hourBne(now) >= 21 || hourBne(now) < 5));
  /* After the Closed or Unavailable page, draw the schedule fresh: nothing to animate from */
  if (blank || closed) render.keys = null;
  if (blank) return;
  if (closed) {
    $('stage').classList.remove('night');
    const html = closedHTML(os, now, hours, classes);
    if (html + orient !== render.closed) { $('c-wrap').innerHTML = html; render.closed = html + orient; fit($('closed')); }
    placeClosed(now);
    return;
  }

  const port = orient === 'port', p = plan(classes, now, orient);
  /* Animate changes only between two schedule draws in the same orientation (not the first draw or a re-layout) */
  /* After the night view, the rows come back with their fade, as if new */
  if (render.night && !p.night && render.keys) render.keys = new Set();
  render.night = p.night;
  const anim = !STILL && render.keys && render.orient === orient;
  /* Rows are measured for gliding only if the last draw has settled (a second draw within 1.5 s would catch them mid-move) */
  const t = performance.now(), settled = t - (render.drawn || 0) > 1500 / SPEED;
  render.drawn = t;
  const was = anim && settled ? rowRects(screen) : null;
  const hero = $('hero'), heroKey = p.next ? p.next.startDate + meta(p.next).name : '';
  let heroOld = null;
  if (anim && heroKey !== render.heroKey) {
    const c = document.createElement('div');
    [].forEach.call(hero.children, x => { if (!x.classList.contains('h-ghost')) c.appendChild(x.cloneNode(true)); });
    c.querySelectorAll('.pulse').forEach(x => x.classList.remove('pulse'));
    heroOld = c.innerHTML;
  } else if (hero.classList.contains('h-in')) { hero.classList.remove('h-in'); clearTimeout(render.heroT); }   /* a redraw mid hand-over: don't play it again */
  const prevHero = render.heroKey;
  render.heroKey = heroKey; render.orient = orient;
  const states = new Map(); p.todayShow.concat(p.mainShow).forEach(c => states.set(c.startDate + meta(c).name, state(c, now)));
  hero.innerHTML = heroHTML(p.next, now, port, p.alt);
  $('stage').classList.toggle('night', p.night);
  $('today-title').textContent = 'Today';   /* the date is already in the header */
  $('today-more').textContent = p.todayMore;
  screen.classList.toggle('no-today', p.noToday);
  $('today').innerHTML = p.todayShow.map(c => rowHTML(c, now)).join('');
  $('later-wrap').classList.toggle('off', !p.mainShow.length);
  screen.classList.toggle('one-day', p.oneDay);
  $('later-title').textContent = p.laterTitle;
  $('later').innerHTML = p.mainShow.map(c => rowHTML(c, now)).join('');
  $('tom-title').textContent = p.sideTitle;
  $('tom-more').textContent = p.sideMore;
  $('later-more').textContent = p.laterMore;
  $('tomorrow').innerHTML = p.sideShow.length ? p.sideShow.map(c => port ? rowHTML(c, now) : trowHTML(c)).join('')
    : msgHTML('No classes listed yet', 'Check back later');
  grow(port);
  fit(screen);
  fillBars(screen);
  if (heroOld !== null) {
    const g = document.createElement('div'); g.className = 'h-ghost'; g.innerHTML = heroOld;
    hero.classList.remove('h-in'); void hero.offsetWidth; hero.classList.add('h-in'); hero.appendChild(g);
    setTimeout(() => g.remove(), 450);
    clearTimeout(render.heroT); render.heroT = setTimeout(() => hero.classList.remove('h-in'), 1200);
  }
  if (was) moveRows(screen, was);
  /* A class that has just started (from Next up, or a "soon" row): its ring eases from orange to white */
  if (anim && render.states) screen.querySelectorAll('.body .row.now[data-k]').forEach(el => {
    if (el.dataset.k === prevHero || render.states.get(el.dataset.k) === 'soon') el.classList.add('went-live'); });
  render.states = states;
  /* Fade in rows that were not on screen before (none on the first draw) */
  const keys = new Set();
  screen.querySelectorAll('.body [data-k]').forEach(el => { keys.add(el.dataset.k); if (render.keys && !render.keys.has(el.dataset.k)) el.classList.add('enter'); });
  render.keys = keys;
}

/* Nightly reload to pick up code changes. Checked on the 5 s tick against the wall clock, because one long timer
   drifts while a screen sleeps. Due between 3 and 5 am (or after 26 h up, for screens that sleep through the night),
   retried every 10 min, and only once the page itself has downloaded, so the screen is never left on an error page. */
const BOOT = Date.now();
let reloadTry = 0;
async function checkReload(now) {
  const h = hourBne(now), up = Date.now() - BOOT;
  const due = (h >= RELOAD_AT_H && h < RELOAD_AT_H + 2 && up > 3 * 3600000) || up > 26 * 3600000;
  if (!due || Q.get('demo') === '1' || Date.now() - reloadTry < 10 * 60000) return;
  reloadTry = Date.now();
  try {
    await timed(signal => fetch(location.href, reqOpts(signal)).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); }));
    location.reload();
  } catch (_) { /* try again in 10 min */ }
}

function safeRender() { try { render(); } catch (e) { console.error('Render failed:', e); } }

/* ═════════ Start ═════════ */
if (LOGO_URL) $('logo').innerHTML = `<img src="${esc(LOGO_URL)}" alt="ATRIA Wellness Club">`;
if (Q.get('demo') !== '1') { const boot = readCache(); if (boot) { classes = boot.classes; hours = boot.hours; savedAt = boot.savedAt; mode = 'starting'; } }
const wake = () => { if (!inFlight) load(); };
window.addEventListener('online', wake);
window.addEventListener('pageshow', e => { if (e.persisted) wake(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(); });
window.addEventListener('resize', () => { dirty = true; safeRender(); });
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { dirty = true; safeRender(); });
/* fonts.ready can settle before Montserrat is even requested, so the Closed page can be laid out (and fitted) in the
   narrower fallback font: refit it once a font has really loaded */
if (document.fonts) document.fonts.addEventListener('loadingdone', () => { render.closed = ''; dirty = true; safeRender(); });
/* The Closed block's drift is worked out from its size: if it grows between passes, re-place it now, not at the next minute */
if (window.ResizeObserver) new ResizeObserver(() => {
  if ($('screen').classList.contains('is-closed')) placeClosed(new Date());
}).observe($('c-wrap'));
setInterval(safeRender, SPEED > 1 ? 1000 : 5000);
if (STILL) $('stage').classList.add('still');
/* ?debug=1: window size, pixel ratio, stage scale, browser engine and frames per second, every 2 s */
if (Q.get('debug') === '1') {
  const d = document.createElement('div'); d.id = 'debug'; document.body.appendChild(d);
  let n = 0, t0 = performance.now();
  const frame = () => { n++; requestAnimationFrame(frame); }; requestAnimationFrame(frame);
  setInterval(() => { const t = performance.now(), fps = Math.round(n * 1000 / (t - t0)); n = 0; t0 = t;
    const chrome = (navigator.userAgent.match(/Chrome\/(\d+)/) || [])[1] || '?';
    d.textContent = `${innerWidth}×${innerHeight} @${devicePixelRatio}x · stage ×${($('stage').getBoundingClientRect().width / $('stage').offsetWidth).toFixed(3)}\n`
      + `${fps} fps · Chrome ${chrome} · ${orient}${STILL ? ' · motion off' : ''}`; }, 2000);
}
load();
safeRender();
</script>
